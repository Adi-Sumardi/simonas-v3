<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&amp;family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-lowest": "#ffffff",
                      "secondary-fixed": "#dbe4ea",
                      "on-primary-fixed": "#00174b",
                      "on-secondary-container": "#5d666b",
                      "primary-fixed-dim": "#b4c5ff",
                      "error-container": "#ffdad6",
                      "tertiary-fixed-dim": "#bec6e0",
                      "secondary-container": "#dbe4ea",
                      "on-surface-variant": "#434655",
                      "surface-container-highest": "#e2e2e2",
                      "on-surface": "#1a1c1c",
                      "on-primary": "#ffffff",
                      "surface-bright": "#f9f9f9",
                      "on-tertiary-fixed-variant": "#3f465c",
                      "on-secondary-fixed-variant": "#3f484d",
                      "primary-fixed": "#dbe1ff",
                      "outline-variant": "#c3c6d7",
                      "on-secondary-fixed": "#141d21",
                      "primary": "#004ac6",
                      "on-primary-fixed-variant": "#003ea8",
                      "tertiary": "#4d556b",
                      "surface-dim": "#dadada",
                      "secondary-fixed-dim": "#bfc8ce",
                      "outline": "#737686",
                      "error": "#ba1a1a",
                      "on-error": "#ffffff",
                      "inverse-surface": "#2f3131",
                      "surface-variant": "#e2e2e2",
                      "surface-container-low": "#f3f3f4",
                      "inverse-primary": "#b4c5ff",
                      "tertiary-fixed": "#dae2fd",
                      "on-secondary": "#ffffff",
                      "primary-container": "#2563eb",
                      "on-error-container": "#93000a",
                      "on-primary-container": "#eeefff",
                      "surface-tint": "#0053db",
                      "surface": "#f9f9f9",
                      "surface-container": "#eeeeee",
                      "surface-container-high": "#e8e8e8",
                      "tertiary-container": "#656d84",
                      "inverse-on-surface": "#f0f1f1",
                      "on-tertiary": "#ffffff",
                      "background": "#f9f9f9",
                      "on-background": "#1a1c1c"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xl": "64px",
                      "lg": "40px",
                      "xs": "4px",
                      "gutter": "24px",
                      "margin": "32px",
                      "sm": "12px",
                      "md": "24px",
                      "base": "8px"
              },
              "fontFamily": {
                      "label-caps": ["Manrope"],
                      "display-lg": ["Lexend"],
                      "title-sm": ["Manrope"],
                      "headline-md": ["Lexend"],
                      "body-md": ["Manrope"]
              },
              "fontSize": {
                      "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "title-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 30px 60px -12px rgba(37, 99, 235, 0.08);
        }
        .recessed-input {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }
    </style>
</head>
<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col items-center justify-center p-gutter">
<div class="fixed inset-0 -z-10">
<div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,_#dbe1ff_0%,_transparent_40%)]"></div>
<div class="absolute inset-0 bg-[radial-gradient(circle_at_bottom_left,_#f3f3f4_0%,_transparent_40%)]"></div>
</div>
<header class="fixed top-0 w-full z-50 flex justify-center py-base">
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="account_balance">account_balance</span>
<span class="font-headline-md text-headline-md text-primary tracking-tight">DormSerenity</span>
</div>
</header>
<main class="w-full max-w-[520px] mx-auto animate-fade-in">
<div class="glass-container rounded-3xl p-lg md:p-xl flex flex-col space-y-md">
<div class="text-center space-y-xs">
<h1 class="font-headline-md text-headline-md text-on-surface">Begin Your Journey</h1>
<p class="font-body-md text-body-md text-secondary">Join our digital academic sanctuary today.</p>
</div>
<form class="space-y-md">
<div class="space-y-base">
<label class="font-label-caps text-label-caps text-outline px-1">Full Name</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="person">person</span>
<input class="w-full pl-12 pr-4 py-3.5 rounded-xl recessed-input border-transparent focus:border-primary focus:ring-0 transition-all font-body-md text-body-md outline-none" placeholder="Enter your full name" type="text"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="space-y-base">
<label class="font-label-caps text-label-caps text-outline px-1">Student ID (NIM)</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="badge">badge</span>
<input class="w-full pl-12 pr-4 py-3.5 rounded-xl recessed-input border-transparent focus:border-primary focus:ring-0 transition-all font-body-md text-body-md outline-none" placeholder="ID Number" type="text"/>
</div>
</div>
<div class="space-y-base">
<label class="font-label-caps text-label-caps text-outline px-1">Dormitory</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="apartment">apartment</span>
<select class="w-full pl-12 pr-4 py-3.5 rounded-xl recessed-input border-transparent focus:border-primary focus:ring-0 transition-all font-body-md text-body-md outline-none appearance-none">
<option disabled="" selected="" value="">Select Asrama</option>
<option>Asrama A</option>
<option>Asrama B</option>
<option>Asrama C</option>
<option>Asrama D</option>
</select>
</div>
</div>
</div>
<div class="space-y-base">
<label class="font-label-caps text-label-caps text-outline px-1">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-3.5 rounded-xl recessed-input border-transparent focus:border-primary focus:ring-0 transition-all font-body-md text-body-md outline-none" placeholder="name@university.edu" type="email"/>
</div>
</div>
<div class="space-y-base">
<label class="font-label-caps text-label-caps text-outline px-1">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="lock_open">lock_open</span>
<input class="w-full pl-12 pr-12 py-3.5 rounded-xl recessed-input border-transparent focus:border-primary focus:ring-0 transition-all font-body-md text-body-md outline-none" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="pt-sm">
<button class="w-full bg-primary text-on-primary font-title-sm text-title-sm py-4 rounded-xl shadow-[0_8px_20px_-4px_rgba(37,99,235,0.4)] hover:shadow-[0_12px_24px_-4px_rgba(37,99,235,0.5)] active:scale-[0.98] transition-all flex items-center justify-center space-x-2" type="submit">
<span>Sign Up</span>
<span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<div class="flex items-center space-x-md py-sm">
<div class="h-px flex-1 bg-outline-variant"></div>
<span class="font-label-caps text-label-caps text-outline">OR</span>
<div class="h-px flex-1 bg-outline-variant"></div>
</div>
<div class="text-center">
<p class="font-body-md text-body-md text-secondary">
                    Already a member? 
                    <a class="text-primary font-bold hover:underline underline-offset-4 transition-all" href="#">Sign In</a>
</p>
</div>
</div>
<div class="mt-lg grid grid-cols-2 gap-md opacity-70">
<div class="glass-container rounded-2xl p-md flex items-center space-x-sm">
<div class="bg-primary/10 p-base rounded-full">
<span class="material-symbols-outlined text-primary" data-icon="verified_user">verified_user</span>
</div>
<div>
<p class="font-label-caps text-label-caps text-on-surface">Secure</p>
<p class="text-[10px] text-secondary font-medium">Verified Registration</p>
</div>
</div>
<div class="glass-container rounded-2xl p-md flex items-center space-x-sm">
<div class="bg-primary/10 p-base rounded-full">
<span class="material-symbols-outlined text-primary" data-icon="volunteer_activism">volunteer_activism</span>
</div>
<div>
<p class="font-label-caps text-label-caps text-on-surface">Reflection</p>
<p class="text-[10px] text-secondary font-medium">Daily Islamic Habit</p>
</div>
</div>
</div>
</main>
<footer class="mt-xl text-center pb-lg">
<p class="font-label-caps text-label-caps text-outline uppercase tracking-widest">© 2024 DormSerenity Sanctuary Hub</p>
</footer>
<div class="fixed bottom-0 left-0 w-full overflow-hidden h-32 -z-20 pointer-events-none">
<div class="absolute bottom-[-50px] left-[10%] w-[300px] h-[300px] bg-primary/5 rounded-full blur-[80px]"></div>
<div class="absolute bottom-[-50px] right-[10%] w-[300px] h-[300px] bg-tertiary-fixed-dim/20 rounded-full blur-[80px]"></div>
</div>
</body></html>
