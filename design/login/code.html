<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - DormSerenity</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#dbe4ea",
                        "on-primary-fixed": "#00174b",
                        "on-secondary-container": "#5d666b",
                        "primary-fixed-dim": "#b4c5ff",
                        "error-container": "#ffdad6",
                        "secondary-container": "#dbe4ea",
                        "on-surface-variant": "#434655",
                        "surface-container-highest": "#e2e2e2",
                        "on-surface": "#1a1c1c",
                        "on-primary": "#ffffff",
                        "surface-bright": "#f9f9f9",
                        "on-tertiary-fixed-variant": "#3f465c",
                        "on-secondary-fixed-variant": "#3f484d",
                        "primary-fixed": "#dbe1ff",
                        "outline-variant": "#c3c6d7",
                        "on-secondary-fixed": "#141d21",
                        "primary": "#004ac6",
                        "on-tertiary-fixed": "#131b2e",
                        "secondary": "#576065",
                        "on-tertiary-container": "#eef0ff",
                        "on-primary-fixed-variant": "#003ea8",
                        "tertiary": "#4d556b",
                        "surface-dim": "#dadada",
                        "secondary-fixed-dim": "#bfc8ce",
                        "outline": "#737686",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2f3131",
                        "surface-variant": "#e2e2e2",
                        "surface-container-low": "#f3f3f4",
                        "inverse-primary": "#b4c5ff",
                        "tertiary-fixed": "#dae2fd",
                        "on-secondary": "#ffffff",
                        "primary-container": "#2563eb",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#eeefff",
                        "surface-tint": "#0053db",
                        "surface": "#f9f9f9",
                        "surface-container": "#eeeeee",
                        "surface-container-high": "#e8e8e8",
                        "tertiary-container": "#656d84",
                        "inverse-on-surface": "#f0f1f1",
                        "on-tertiary": "#ffffff",
                        "background": "#f9f9f9",
                        "on-background": "#1a1c1c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "64px",
                        "lg": "40px",
                        "xs": "4px",
                        "gutter": "24px",
                        "margin": "32px",
                        "sm": "12px",
                        "md": "24px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "label-caps": ["Manrope"],
                        "display-lg": ["Lexend"],
                        "title-sm": ["Manrope"],
                        "headline-md": ["Lexend"],
                        "body-md": ["Manrope"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "title-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-background {
            background: linear-gradient(135deg, #f9f9f9 0%, #eef2ff 100%);
        }
        .frosted-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
        }
        .floating-element {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="font-body-md text-body-md bg-background text-on-background min-h-screen relative overflow-hidden flex items-center justify-center p-md">
<!-- Floating Background Elements -->
<div class="floating-element w-48 h-48 -top-12 -left-12 rotate-12 flex items-center justify-center">
<span class="material-symbols-outlined text-primary/20 text-6xl" data-icon="menu_book">menu_book</span>
</div>
<div class="floating-element w-32 h-32 top-1/4 -right-8 -rotate-12 flex items-center justify-center">
<span class="material-symbols-outlined text-primary/10 text-5xl" data-icon="school">school</span>
</div>
<div class="floating-element w-56 h-56 -bottom-16 right-1/4 rotate-45 flex items-center justify-center">
<span class="material-symbols-outlined text-primary/15 text-7xl" data-icon="edit_note">edit_note</span>
</div>
<div class="floating-element w-40 h-40 bottom-1/4 -left-10 rotate-6 flex items-center justify-center">
<span class="material-symbols-outlined text-primary/10 text-5xl" data-icon="auto_stories">auto_stories</span>
</div>
<!-- Login Container -->
<main class="w-full max-w-[480px] z-10">
<div class="frosted-glass rounded-[2rem] p-lg shadow-[0_30px_60px_rgba(37,99,235,0.08)] flex flex-col gap-lg">
<!-- Logo and Header -->
<header class="flex flex-col items-center gap-base text-center">
<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center shadow-lg shadow-primary/20 mb-base">
<span class="material-symbols-outlined text-white text-3xl" data-icon="domain" data-weight="fill" style="font-variation-settings: 'FILL' 1;">domain</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">DormSerenity</h1>
<p class="font-body-md text-body-md text-secondary">Academic Sanctuary Management</p>
</header>
<!-- Form -->
<form class="flex flex-col gap-md">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-xs">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-white/40 border-none rounded-xl focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline-variant text-on-surface text-body-md" placeholder="mentor@dormserenity.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant">Password</label>
<a class="font-label-caps text-[11px] text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-white/40 border-none rounded-xl focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline-variant text-on-surface text-body-md" placeholder="••••••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm px-xs">
<input class="w-5 h-5 rounded bg-white/40 border-outline-variant text-primary focus:ring-primary-container transition-all" id="remember" type="checkbox"/>
<label class="text-body-md text-secondary cursor-pointer select-none" for="remember">Remember this device</label>
</div>
<!-- Submit Button -->
<button class="w-full py-4 bg-primary text-white font-title-sm text-title-sm rounded-xl shadow-[0_10px_20px_rgba(0,74,198,0.2)] hover:shadow-[0_15px_25px_rgba(0,74,198,0.3)] hover:-translate-y-0.5 transition-all active:scale-95 flex items-center justify-center gap-base" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Sign Up Footer -->
<footer class="flex flex-col items-center gap-md">
<div class="flex items-center gap-md w-full">
<div class="h-[1px] bg-outline-variant flex-grow"></div>
<span class="text-label-caps text-outline-variant uppercase">New to the sanctuary?</span>
<div class="h-[1px] bg-outline-variant flex-grow"></div>
</div>
<p class="text-body-md text-secondary">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline transition-all ml-xs" href="#">Create Account</a>
</p>
</footer>
</div>
<!-- System Branding -->
<div class="mt-lg flex justify-center items-center gap-xl text-outline-variant text-[12px] font-medium tracking-wide">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="verified_user">verified_user</span>
                Secure Login
            </div>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="help">help</span>
                Support Hub
            </div>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="language">language</span>
                EN
            </div>
</div>
</main>
<!-- Background Decorative Visual -->
<div class="fixed inset-0 -z-10 pointer-events-none opacity-40">
<div class="absolute top-[10%] left-[15%] w-72 h-72 bg-primary/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[10%] right-[15%] w-96 h-96 bg-primary/5 blur-[120px] rounded-full"></div>
</div>
</body></html>
